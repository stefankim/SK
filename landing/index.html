<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A101C" />
    <!--meta-->
    <!--/meta-->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/instrumentserif-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--jsonld-->
    <script>
      // Theme before first paint: the saved choice, else dark.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#E9EDF3');
      } catch (e) {}
    </script>
    <!--redirect-->
    <script>
      // First visit: Slovak or Czech anywhere in the browser's languages stays on Slovak,
      // everyone else goes to the English page. A stored choice, a link from this site
      // and crawlers (so search engines index the Slovak page) skip it.
      try {
        var internal = document.referrer.indexOf(location.origin + '/') === 0;
        var bot = /bot|crawl|spider|slurp|preview/i.test(navigator.userAgent);
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        var sk = false;
        for (var i = 0; i < langs.length; i++) if (/^(sk|cs)\b/i.test(langs[i])) sk = true;
        if (!localStorage.getItem('lang') && !sk && !internal && !bot && location.pathname === '%BASE_URL%') {
          location.replace('%BASE_URL%en/' + location.search + location.hash);
        }
      } catch (e) {}
    </script>
    <!--/redirect-->
    <noscript><style>.reveal, .hero-line, pre code span { opacity: 1 !important; filter: none !important; transform: none !important; animation: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
