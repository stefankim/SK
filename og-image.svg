<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d2c8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d2c8" stop-opacity=".42"/><stop offset="1" stop-color="#00d2c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="130" r="330" fill="url(#glow1)"/>
  <circle cx="150" cy="600" r="300" fill="url(#glow2)"/>

  <g transform="translate(88,96)">
    <text font-size="30" font-weight="700" letter-spacing="2" fill="#00d2c8" font-family="Menlo, DejaVu Sans Mono, monospace">&lt;SK/&gt;</text>
    <text y="112" font-size="82" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Stefan Kimak</text>
    <text y="176" font-size="38" font-weight="500" fill="#9aa3b8">Senior Full-Stack &amp; AI Engineer</text>
    <rect y="216" width="132" height="6" rx="3" fill="url(#accent)"/>
    <text y="298" font-size="34" font-weight="600" fill="#e6e9f2">Scalable platforms in PHP —</text>
    <text y="348" font-size="34" font-weight="600" fill="#e6e9f2">made smarter with AI.</text>
  </g>

  <g transform="translate(88,502)" font-size="25" font-weight="600" fill="#cbd2e3">
    <g>
      <rect x="0" y="-30" width="104" height="46" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="52" y="0" text-anchor="middle">PHP</text>
    </g>
    <g transform="translate(120,0)">
      <rect x="0" y="-30" width="140" height="46" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="70" y="0" text-anchor="middle">Drupal</text>
    </g>
    <g transform="translate(276,0)">
      <rect x="0" y="-30" width="160" height="46" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="80" y="0" text-anchor="middle">Symfony</text>
    </g>
    <g transform="translate(452,0)">
      <rect x="0" y="-30" width="152" height="46" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="76" y="0" text-anchor="middle">Laravel</text>
    </g>
    <g transform="translate(620,0)">
      <rect x="0" y="-30" width="140" height="46" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="70" y="0" text-anchor="middle">Vue.js</text>
    </g>
    <g transform="translate(776,0)">
      <rect x="0" y="-30" width="96" height="46" rx="10" fill="#7c5cff" fill-opacity=".22" stroke="#7c5cff" stroke-opacity=".5"/>
      <text x="48" y="0" text-anchor="middle" fill="#ffffff">AI</text>
    </g>
  </g>

  <text x="1112" y="556" text-anchor="end" font-size="27" font-weight="600" fill="#00d2c8" font-family="Menlo, DejaVu Sans Mono, monospace">stefankimak.dev</text>
</svg>
